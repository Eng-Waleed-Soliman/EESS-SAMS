name: Keep Render service awake

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping application health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 10 \
            --connect-timeout 20 --max-time 120 \
            "https://eess-sams.onrender.com/health/?timestamp=$(date +%s)"