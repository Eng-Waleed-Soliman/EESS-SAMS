services:
  - type: web
    name: EESS-SAMS
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    healthCheckPath: /health/
    # Keep one memory-efficient process with enough threads for slow database
    # requests. Do not preload: on the 512 MB plan the master would retain an
    # additional Django memory image alongside the worker.
    startCommand: python manage.py migrate --noinput && gunicorn sams_project.wsgi:application --workers 1 --threads 4 --timeout 120 --graceful-timeout 30 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100 --worker-tmp-dir /dev/shm --access-logfile - --error-logfile -
