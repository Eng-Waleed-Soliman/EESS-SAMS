services:
  - type: web
    name: EESS-SAMS
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn sams_project.wsgi:application --workers 1 --threads 4 --timeout 120 --max-requests 100 --max-requests-jitter 20 --access-logfile - --error-logfile -
