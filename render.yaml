services:
  - type: web
    name: EESS-SAMS
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    healthCheckPath: /health/
    startCommand: python manage.py migrate --noinput && gunicorn sams_project.wsgi:application --workers 1 --threads 2 --timeout 120 --graceful-timeout 30 --keep-alive 5 --max-requests 200 --max-requests-jitter 25 --worker-tmp-dir /dev/shm --access-logfile - --error-logfile -
