{% extends 'academies/base.html' %}
{% block content %}
<div class="d-flex justify-content-between mb-3 flex-wrap gap-2">
  <h3>إضافات الكافيتريا</h3>
  <div class="d-flex gap-2 flex-wrap">
    <a class="btn btn-secondary" href="{% url 'cafe_settings' %}">إعدادات الكافيتريا</a>
    <a class="btn" href="{% url 'cafe_addon_create' %}">إضافة جديدة</a>
  </div>
</div>
<form class="mb-3">
  <input name="q" value="{{ q }}" class="form-control search-box w-half" placeholder="ابحث باسم الإضافة">
</form>
<div class="card p-3">
  <div class="table-responsive">
    <table class="table table-striped align-middle text-center mb-0">
      <thead><tr><th>اسم الصنف</th><th>سعر البيع</th><th></th></tr></thead>
      <tbody>
        {% for addon in addons %}
        <tr>
          <td class="fw-bold">{{ addon.name }}</td>
          <td>{{ addon.sale_price }}</td>
          <td>
            <a class="btn btn-sm" href="{% url 'cafe_addon_update' addon.pk %}">تعديل</a>
            <a class="btn btn-sm btn-danger" href="{% url 'cafe_addon_delete' addon.pk %}">حذف</a>
          </td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-muted">لم تتم إضافة أصناف إضافية بعد.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
