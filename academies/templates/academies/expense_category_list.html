{% extends 'academies/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <h3>فئات المصاريف</h3>
  <div class="d-flex gap-2">
    <a class="btn btn-secondary" href="{% url 'settings_home' %}">رجوع للإعدادات</a>
    <a class="btn btn-success" href="{% url 'expense_category_create' %}">إضافة فئة مصروف</a>
  </div>
</div>
<div class="card p-3 table-responsive">
  <table class="table table-striped align-middle text-center">
    <thead><tr><th>فئة المصروف</th><th>ملاحظات</th><th>الإجراء</th></tr></thead>
    <tbody>
      {% for category in categories %}
      <tr>
        <td class="fw-bold">{{ category.name }}</td>
        <td>{{ category.notes|default:"-" }}</td>
        <td><a class="btn btn-sm btn-primary" href="{% url 'expense_category_update' category.pk %}">تعديل</a></td>
      </tr>
      {% empty %}<tr><td colspan="3">لا توجد فئات مصاريف مسجلة</td></tr>{% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
